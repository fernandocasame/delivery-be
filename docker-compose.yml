version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: delivery-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delivery-backend
    restart: unless-stopped
    ports:
      - "8003:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delivery-celery-worker
    restart: unless-stopped
    command: celery -A core worker -l info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
      - backend

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delivery-celery-beat
    restart: unless-stopped
    command: celery -A core beat -l info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
      - backend
